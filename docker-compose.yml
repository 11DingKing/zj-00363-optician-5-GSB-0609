version: '3.8'

services:
  app:
    build: .
    container_name: school-entry-audit
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:h2:file:/app/data/school-entry-audit;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-}
    volumes:
      - h2-data:/app/data

volumes:
  h2-data:
